name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method when signing secrets are configured"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kotlin framework + Xcode archive + IPA
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      SIGNING_PROFILE_BASE64: ${{ secrets.SIGNING_PROFILE_BASE64 }}
      SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
      EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin/Native framework for iOS devices
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:linkReleaseFrameworkIosArm64

      - name: Prepare code signing
        id: signing
        run: bash .github/scripts/setup-signing.sh

      - name: Xcode archive (signed)
        if: steps.signing.outputs.ready == 'true'
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
        run: |
          if [ "$EXPORT_METHOD" = "app-store" ]; then
            IDENTITY="Apple Distribution"
          else
            IDENTITY="Apple Development"
          fi
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/iosApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      - name: Xcode archive (unsigned fallback)
        if: steps.signing.outputs.ready != 'true'
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Export signed IPA
        if: steps.signing.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/iosApp.xcarchive" \
            -exportPath "$PWD/build/output" \
            -exportOptionsPlist "$PWD/build/exportOptions.plist"

      - name: Package unsigned IPA
        if: steps.signing.outputs.ready != 'true'
        run: |
          mkdir -p build/output Payload
          cp -R build/iosApp.xcarchive/Products/Applications/*.app Payload/
          zip -qry build/output/Musicfy-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: musicfy-ipa-${{ steps.signing.outputs.ready == 'true' && 'signed' || 'unsigned' }}
          path: build/output/*.ipa
          if-no-files-found: error
          retention-days: 30
